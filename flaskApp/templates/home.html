<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Topic Modeling Demo</title>

</head>
<body>

{% extends "layout.html" %}
{% block content %}
<div class="home">
<form class="form-inline" method="POST" action="{{ url_for('result') }}">
  <br class="form-group">

    <div class="input-group">

        <span class="input-group-addon"> <h3></h3></span>


        <h1>Algorithm</h1>
            <h2>Base Model </h2>
            <select name="selected_base_model" class="selectpicker form-control">
              {% for base in base_models %}
              <option value="{{ base }}">{{ base }}</option>
              {% endfor %}
            </select>

            <h2>Word Embedding </h2>
            <select name="selected_embedding" class="selectpicker form-control">
              {% for embedding in embeddings %}
              <option value="{{ embedding }}">{{ embedding }}</option>
              {% endfor %}
            </select>

            <h2>Number of Clusters </h2>
            <select name="selected_k" class="selectpicker form-control">
              {% for k in num_clusters %}
              <option value="{{ k }}">{{ k }}</option>
              {% endfor %}
            </select>

            <h1>Visualizations </h1>
            <h2>N grams </h2>
            <select name="selected_ngram" class="selectpicker form-control">
              {% for grams in n_grams %}
              <option value="{{ grams }}">{{ grams }}</option>
              {% endfor %}
            </select>

            <h2>Visualization Type </h2>
            <select name="selected_vis" class="selectpicker form-control">
              {% for vis in visualizations %}
              <option value="{{ vis }}">{{ vis }}</option>
              {% endfor %}
            </select>

            </div>





      <br>
    <button type="submit" class="button">Generate Clusters</button>

</form>

</div>
{% endblock %}
</body>
</html>
