<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Topic Modeling Demo</title>
    <link rel="stylesheet" href="static/css/main.css">

</head>
<body>
<h1> Hello {{ user.username }}! </h1>

<form class="form-inline" method="POST" action="{{ url_for('result') }}">
  <br class="form-group">
    <div class="input-group">
        <span class="input-group-addon"> <h2>Please Select Hyperparamters for Clustering and Topic Modeling</h2></span>

            <h2>1. Algorithm</h2>
            <h3>Base Model </h3>
            <select name="selected_base_model" class="selectpicker form-control">
              {% for base in base_models %}
              <option value="{{ base }}">{{ base }}</option>
              {% endfor %}
            </select>

            <h3>Word Embedding </h3>
            <select name="selected_embedding" class="selectpicker form-control">
              {% for embedding in embeddings %}
              <option value="{{ embedding }}">{{ embedding }}</option>
              {% endfor %}
            </select>

            <h3>Number of Clusters </h3>
            <select name="selected_k" class="selectpicker form-control">
              {% for k in num_clusters %}
              <option value="{{ k }}">{{ k }}</option>
              {% endfor %}
            </select>

            <h2>2. Topic </h2>
            <p> TODO: include hyperparameters for generating n-grams</p>


    </div>
      <br>
    <button type="submit" class="btn btn-default">Generate Clusters</button>

</form>


</body>
</html>
